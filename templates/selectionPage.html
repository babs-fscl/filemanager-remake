{% extends 'base.html' %}
{% block content %}
<style>
    :root {
        --primary-blue: #3b82f6;
        --primary-green: #10b981;
        --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(255, 255, 255, 0.5);
    }

    body {
        background: var(--bg-gradient);
        min-height: 100vh;
    }

    .full-height {
        min-height: calc(100vh - 80px); /* Adjust for navbar height */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }

    .cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2rem;
        max-width: 1000px;
        width: 100%;
        margin: 0 auto;
    }

    .selection-card {
        position: relative;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 3rem 2rem;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        overflow: hidden;
    }

    .selection-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        transition: all 0.3s ease;
    }

    .card-blue::before { background: var(--primary-blue); }
    .card-green::before { background: var(--primary-green); }

    .selection-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        background: rgba(255, 255, 255, 0.9);
    }

    .selection-card:hover::before {
        height: 12px;
    }

    .icon-wrapper {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        font-size: 2.5rem;
        transition: all 0.3s ease;
    }

    .card-blue .icon-wrapper {
        background: rgba(59, 130, 246, 0.1);
        color: var(--primary-blue);
    }

    .card-green .icon-wrapper {
        background: rgba(16, 185, 129, 0.1);
        color: var(--primary-green);
    }

    .selection-card:hover .icon-wrapper {
        transform: scale(1.1) rotate(5deg);
    }

    .card-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 0.75rem;
    }

    .card-desc {
        font-size: 1rem;
        color: #64748b;
        line-height: 1.5;
    }

    @media (max-width: 768px) {
        .cards-container {
            grid-template-columns: 1fr;
            max-width: 450px;
        }
        
        .selection-card {
            padding: 2.5rem 1.5rem;
        }
    }
</style>

<div class="container-fluid">
    <div class="full-height">
        <div class="cards-container">
            <a href="{% url 'upload' %}" class="selection-card card-blue">
                <div class="icon-wrapper">
                    <i class="bi bi-file-earmark-text"></i>
                </div>
                <div class="card-title">Document Manager</div>
                <div class="card-desc">Advanced analysis for PDFs, Excel, and Docx files.</div>
            </a>
            
            <a href="{% url 'new_project' %}" class="selection-card card-green">
                <div class="icon-wrapper">
                    <i class="bi bi-globe2"></i>
                </div>
                <div class="card-title">Project Hub</div>
                <div class="card-desc">Crawl websites, sitemaps, and YouTube video transcripts.</div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
