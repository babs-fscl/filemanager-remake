{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    {% include 'messages.html' %}

                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="rounded-3 bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width: 56px; height: 56px;">
                            <i class="bi bi-file-earmark-text fs-3"></i>
                        </div>
                        <div class="text-truncate">
                            <h1 class="h4 fw-bold mb-1 text-truncate">{{ file.name|default:file.file.name }}</h1>
                            <div class="text-muted small">
                                Shared document{% if file.user %} from {{ file.user.get_full_name|default:file.user.email }}{% endif %}
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <a class="btn btn-primary flex-fill" href="{% url 'download' file.pk %}">
                            <i class="bi bi-download me-2"></i>Download
                        </a>
                        <a class="btn btn-outline-primary flex-fill" href="{% url 'chatbot' file.uuid %}">
                            <i class="bi bi-chat-text me-2"></i>Open Chat
                        </a>
                        <a class="btn btn-outline-secondary flex-fill" href="{% url 'my_documents' %}">
                            <i class="bi bi-folder2-open me-2"></i>Library
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
